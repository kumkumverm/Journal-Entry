spring.data.mongodb.auto-index-creation=true
logging.level.root=error

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=journaldb
weather.api.key=${WEATHER_API_KEY}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${JAVA_EMAIL}
spring.mail.password=${JAVA_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


#for redis cloud
spring.redis.host=${REDIS_HOST}
spring.redis.port=19867
spring.redis.username=default
spring.redis.password=${REDIS_PASSWORD}
spring.redis.ssl=false

#AIVEN KAFKA
spring.kafka.bootstrap-servers=${KAFKA_SERVERS}

spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256

spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="x" password="x";

spring.kafka.properties.ssl.truststore.location=${KAFKA_CA_PATH}
spring.kafka.properties.ssl.truststore.type=PEM

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
